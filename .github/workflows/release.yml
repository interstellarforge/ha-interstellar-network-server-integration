name: Release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate tag matches manifest
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          MANIFEST_VERSION="$(python3 - <<'PY'
          import json
          print(json.load(open("custom_components/interstellar_network/manifest.json"))["version"])
          PY
          )"
          test "$VERSION" = "$MANIFEST_VERSION" || {
            echo "Tag $TAG does not match manifest version $MANIFEST_VERSION"
            exit 1
          }

      - name: Create manual-install archive
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            dist/interstellar-network-v*.zip \
            --clobber
